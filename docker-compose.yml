services:
  postgres:
    image: postgres:15-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-payment_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-payment_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-payment_secret}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-payment_user} -d ${DATABASE_NAME:-payment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: payment_postgres_data
