server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: payment-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DATABASE_USERNAME:payment_user}
    password: ${DATABASE_PASSWORD:payment_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentHikariCP
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

payment:
  gateway: ${PAYMENT_GATEWAY:fake}
  api-key: ${APP_API_KEY:dev-api-key-12345}
  fake-gateway-webhook-secret: ${FAKE_GATEWAY_WEBHOOK_SECRET:fake-webhook-secret-key-12345}
  currency:
    default: INR
    allowed:
      - INR
  max-amount: 100000.00
  allow-multiple-active-per-order: false
  qr:
    expiry: PT15M
  dev:
    enabled: false
